name: mirror to cafaye git
on:
  push:
    branches: [master]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git remote add forgejo https://cafaye:${{ secrets.FORGEJO_TOKEN }}@git.cafaye.com/cafaye/cafe.git
          git push forgejo master --force
