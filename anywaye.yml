# anywaye.yml — the anywaye project manifest.
#
# The schema is owned by anywaye/core, not by this repository: this file is
# validated against the copy vendored at internal/contract/schemas. Do not add
# fields here that core does not define — `additionalProperties: false` means a
# field core has not declared is an error, and `cafe contract lint` reports it.
#
# Checked with:
#
#   go run ./cmd/cafe contract lint .
name: cafe
description: The anywaye platform CLI. One binary, one manifest, one set of contracts.

# The language decides the container port cafe publishes and the toolchain
# `cafe doctor` checks for: both are read from this field rather than from a list
# written beside the command, so the image and the port cannot disagree.
language: go

# Environment variables this service needs at runtime. Secret values never
# appear here — only names and metadata. cafe dev reads this to provision
# dev secrets into the keyring and inject them into the stack.
env:
  - name: CAF_IDENTITY_URL
    required: true
    secret: false
    default: "http://localhost:8080"
    description: "Identity service URL for agent authentication."
  - name: CAF_LEDGER_DIR
    required: false
    secret: false
    description: "Directory for the env-up ledger; defaults to the user state directory."

# The version of the core contract this was written against. `cafe contract
# resolve` answers whether a given core version is inside it, and service CI
# pins core to a release that is.
core: ^0.2.0

# cafe is a binary, not a service: it exposes no HTTP surface and publishes no
# events, so `exposes` is omitted entirely. A repository that declares a
# contract surface must declare a real one, and this one has none.
dependencies: []

repository:
  url: git@github.com:anywaye/cafe.git
  defaultBranch: master
  visibility: private

owner:
  team: cafe
  contact: cafe@anywaye.com
