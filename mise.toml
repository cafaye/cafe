# Toolchain pins for this repository: Go, the language cafe is written in,
# golangci-lint, the linter bin/prime runs over kit's config, and goreleaser,
# the release tool `.github/workflows/release.yml` runs on a tag push.
#
#   mise install    # install the pinned toolchain
#   mise run prime  # the gate
#
# golangci-lint is the fleet's Go linter. Pinned here so `bin/prime` and CI
# agree on the version that decides whether the tree is lint-clean. The pin
# lives in one more place: `cafaye/kit/.github/workflows/ci.reusable.yml`'s
# `golangci/golangci-lint-action` step, which pins the same version via its
# `version:` input. A bump touches both, in the same commit — otherwise local
# and CI disagree, which is the defect this packet exists to close.
#
# goreleaser is a single source too: the release workflow reads this pin out of
# this file rather than repeating it, exactly as CI's gate job reads
# golangci-lint's — so a local `goreleaser release --snapshot --clean` exercises
# the same config a tag push runs.
[tools]
go = "1.25.0"
"golangci-lint" = "2.14.0"
"goreleaser" = "2.18.3"

[tasks.prime]
description = "The gate: download, build, test"
run = "./bin/prime"

[tasks.doctor]
description = "Build cafe and report the local toolchains"
run = "go run ./cmd/cafe doctor"
